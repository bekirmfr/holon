name: ci

on: [push, pull_request]

jobs:
  # 1. The whole workspace must pass native tests (this covers holon-core AND holon-host).
  native:
    runs-on: ubuntu-latest
    # The Postgres and MySQL a flow's databases may be (engines.rs): the tests that bind them
    # (tests.rs, fresh_databases) run against these, each in a database of its own.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: holon
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: holon
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pholon" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      HOLON_TEST_POSTGRES: postgres://postgres:holon@127.0.0.1:5432/postgres
      HOLON_TEST_MYSQL: mysql://root:holon@127.0.0.1:3306/mysql
      HOLON_TEST_MONGODB: mongodb://127.0.0.1:27017/holontest?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      # The MongoDB they may be too (mongo.rs): a one-node replica set, since a commit is a
      # transaction. Started by hand: a service container can't be given --replSet.
      - run: bash .github/start-mongodb.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --workspace
      # Lints as errors: the workspace is clean, and stays so.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The `holon` command, as installed: it writes a sample as text and checks it on its own.
      - run: cargo run -q -p holon -- new "$RUNNER_TEMP/slugs.holon" --sample slugs && cargo run -q -p holon -- check "$RUNNER_TEMP/slugs.holon"

  # 2. The pure core + bridge must COMPILE to wasm32 (catches a dependency that isn't
  #    wasm-compatible — the most common first surprise).
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p holon-wasm --target wasm32-unknown-unknown

  # 3. The guardrail: run the parity body UNDER wasm and assert it matches the core. Together with
  #    the native run in job (1), this proves wasm-core hashes bit-identically to native-core.
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack test --node crates/holon-wasm

  # 4. The editor, against the wasm package built here (it's generated, never committed):
  #    type-checked, and its tests run. Those include every sample flow building from the live
  #    catalog and deriving through the real core (CLAUDE.md), so a sample that stops building,
  #    or a primitive with no description, fails here.
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build crates/holon-wasm --target web --out-dir ../../editor/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
        working-directory: editor
      - run: npx tsc --noEmit -p .
        working-directory: editor
      - run: npx vitest run
        working-directory: editor
      # The editor, built and compiled into holon, as releases are: one binary serves it.
      - run: npm run build
        working-directory: editor
      - run: cargo test -p holon --features embed-editor editor

  # 5. End to end: the editor in a real browser against a real `holon serve`, both started by
  #    Playwright (editor/playwright.config.ts) with throwaway state. Every sample opens and
  #    deploys through the consent screen; requests replay exactly in view mode.
  e2e:
    runs-on: ubuntu-latest
    # The atlas-notes sample's MongoDB (editor/e2e/server.mjs binds it).
    env:
      HOLON_TEST_MONGODB: mongodb://127.0.0.1:27017/holontest?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/start-mongodb.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build crates/holon-wasm --target web --out-dir ../../editor/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
        working-directory: editor
      - run: npx playwright install --with-deps chromium
        working-directory: editor
      - run: npx playwright test
        working-directory: editor
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: editor/test-results

  # 6. The VS Code extension (editors/vscode): its grammar on every sample, through VS Code's own
  #    TextMate engine; then, in a real VS Code (downloaded, on a virtual display), a flow's
  #    mistake, hover and formatting through `holon lsp`.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p holon
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: xvfb-run -a npm run test:vscode
        working-directory: editors/vscode
