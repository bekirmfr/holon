name: ci

# Main on every push; anything else through its pull request, once (a branch pushed with a PR
# open ran twice before). A tag runs no CI of its own: its commit ran it when it reached main.
# `workflow_dispatch` runs it by hand on any branch. The end-to-end suite is e2e.yml, which runs
# less often: on main, nightly, and a pull request labelled `e2e` or a release's.
#
# On a pull request, what it changes decides what each job does (.github/file-rules.txt, applied
# by .github/what-changed.sh, the same in every job): a change to documents alone runs nothing
# and every job ends green; a change to the editor alone (editor/, editors/vscode/) runs no Rust
# tests but the one that reads every file for the names the docs cite. Every job still starts
# and reports, so a required check never waits on a job a filter skipped. A push to main and a
# run by hand run everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the run it supersedes; on main every commit runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The token a run holds reads the repository and nothing else: no job here writes to it. An
# action that isn't GitHub's own is named by its commit, since a tag or a branch can be moved to
# other code, and these run on every push to main.
permissions:
  contents: read

jobs:
  # 1. The whole workspace must pass native tests (this covers holon-core AND holon-host).
  native:
    runs-on: ubuntu-latest
    # The Postgres and MySQL a flow's databases may be (engines.rs): the tests that bind them
    # (tests.rs, fresh_databases) run against these, each in a database of its own.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: holon
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: holon
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pholon" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      HOLON_TEST_POSTGRES: postgres://postgres:holon@127.0.0.1:5432/postgres
      HOLON_TEST_MYSQL: mysql://root:holon@127.0.0.1:3306/mysql
      HOLON_TEST_MONGODB: mongodb://127.0.0.1:27017/holontest?replicaSet=rs0
    steps:
      # Two deep: a pull request's checkout is the merge commit, compared with its first parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: What changed
        id: changed
        run: bash .github/what-changed.sh
      # The MongoDB they may be too (mongo.rs): a one-node replica set, since a commit is a
      # transaction. Started by hand: a service container can't be given --replSet.
      - if: steps.changed.outputs.rust == 'true'
        run: bash .github/start-mongodb.sh
      - if: steps.changed.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11-15
        with:
          components: clippy
      # Dependencies built once and kept (Cargo.lock and the toolchain key it); saved from main
      # only, so pull requests read main's and don't crowd the cache. The same in every job.
      - if: steps.changed.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, 2026-11-15
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.changed.outputs.rust == 'true'
        run: cargo test --workspace
      # A change to the editor alone: of the Rust tests, only the one that reads the editor's
      # files too (every name the docs cite must be one some code has).
      - name: The names the docs cite
        if: steps.changed.outputs.rust != 'true' && steps.changed.outputs.code == 'true'
        run: cargo test -p holon-author --test manual
      # Lints as errors: the workspace is clean, and stays so.
      - if: steps.changed.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The `holon` command, as installed: it writes a sample as text and checks it on its own.
      - if: steps.changed.outputs.rust == 'true'
        run: cargo run -q -p holon -- new "$RUNNER_TEMP/slugs.holon.ts" --sample slugs && cargo run -q -p holon -- check "$RUNNER_TEMP/slugs.holon.ts"

  # 2. The guardrail: run the parity body UNDER wasm and assert it matches the core. Together with
  #    the native run in job (1), this proves wasm-core hashes bit-identically to native-core. It
  #    also proves the pure core + bridge compile to wasm32 (a dependency that isn't
  #    wasm-compatible fails here), which was a job of its own.
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: What changed
        id: changed
        run: bash .github/what-changed.sh
      - if: steps.changed.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11-15
        with:
          targets: wasm32-unknown-unknown
      - if: steps.changed.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, 2026-11-15
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-pack at a pinned version, the one releases use (.github/build-setup.yml): asked for
      # "latest", the action asks GitHub's API, and when that fails it installs v0.9.1, which has
      # no --no-opt. A version named is downloaded as it is. The same in every job.
      - if: steps.changed.outputs.code == 'true'
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0
      - if: steps.changed.outputs.code == 'true'
        run: wasm-pack test --node crates/holon-wasm
        # It downloads wasm-bindgen and wasm-opt; a stalled download fails here, not after 6 h.
        timeout-minutes: 10

  # 3. The editor, against the wasm package built here (it's generated, never committed):
  #    type-checked, and its tests run. Those include every sample flow building from the live
  #    catalog and deriving through the real core (CLAUDE.md), so a sample that stops building,
  #    or a primitive with no description, fails here.
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: What changed
        id: changed
        run: bash .github/what-changed.sh
      - if: steps.changed.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11-15
        with:
          targets: wasm32-unknown-unknown
      - if: steps.changed.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, 2026-11-15
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.changed.outputs.code == 'true'
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0
      # `--no-opt`, as releases build it (.github/build-setup.yml): the wasm tested is the wasm
      # shipped, and no wasm-opt download or pass.
      - if: steps.changed.outputs.code == 'true'
        run: wasm-pack build crates/holon-wasm --target web --out-dir ../../editor/wasm --no-opt
        timeout-minutes: 10
      - if: steps.changed.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - if: steps.changed.outputs.code == 'true'
        run: npm ci
        working-directory: editor
      - if: steps.changed.outputs.code == 'true'
        run: npx tsc --noEmit -p .
        working-directory: editor
      - if: steps.changed.outputs.code == 'true'
        run: npx vitest run
        working-directory: editor
      # The editor, built and compiled into holon, as releases are: one binary serves it.
      - if: steps.changed.outputs.code == 'true'
        run: npm run build
        working-directory: editor
      - if: steps.changed.outputs.code == 'true'
        run: cargo test -p holon --features embed-editor editor

  # 4. The VS Code extension (editors/vscode): in a real VS Code (downloaded, on a virtual
  #    display), a flow's mistake, completion, hover and formatting through `holon lsp`.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: What changed
        id: changed
        run: bash .github/what-changed.sh
      - if: steps.changed.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11-15
      - if: steps.changed.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, 2026-11-15
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.changed.outputs.code == 'true'
        run: cargo build -p holon
      - if: steps.changed.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - if: steps.changed.outputs.code == 'true'
        run: npm ci
        working-directory: editors/vscode
      - if: steps.changed.outputs.code == 'true'
        run: xvfb-run -a npm run test:vscode
        working-directory: editors/vscode

  # 5. No dependency with a known advisory: the crates Cargo.lock names (`cargo audit`, against
  #    the RustSec database as it is that day) and the packages the editor and the extension ship
  #    (`npm audit --omit=dev`). What cargo audit is told not to fail on is in .cargo/audit.toml,
  #    each with why. A new advisory fails this job on whatever pull request runs next, whoever's
  #    it is: update the crate, or list it there with its reason. The tools a build or a test
  #    runs (vite, vitest, playwright) are not audited here.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: What changed
        id: changed
        run: bash .github/what-changed.sh
      - if: steps.changed.outputs.code == 'true'
        run: cargo install cargo-audit --locked --version 0.23.0
      - if: steps.changed.outputs.code == 'true'
        run: cargo audit
      - if: steps.changed.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.changed.outputs.code == 'true'
        run: npm audit --omit=dev
        working-directory: editor
      - if: steps.changed.outputs.code == 'true'
        run: npm audit --omit=dev
        working-directory: editors/vscode
