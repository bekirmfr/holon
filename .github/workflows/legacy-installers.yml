# A release's installers under the name releases up to 0.1.0-rc.3 used, `holon-server-installer`:
# a `holon-server update` there looks for that name in the newest release and runs it, which then
# installs holon (and its holon-server alias) in its place, reading that install's settings
# under their old names (legacy-installers.sh). Run by release.yml (cargo-dist's
# publish-jobs, dist-workspace.toml) once the release is up.
name: legacy installers

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Upload holon's installers as holon-server's too
        run: |
          mkdir installers
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir installers -p holon-installer.sh -p holon-installer.ps1
          bash .github/legacy-installers.sh installers legacy
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" legacy/holon-server-installer.sh legacy/holon-server-installer.ps1
