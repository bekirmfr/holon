[package]
name = "holon"
version = "0.1.0-rc.29"
edition = "2024"
# Proprietary: all rights reserved (the repository's LICENSE, which releases carry: see
# dist-workspace.toml). Never published to crates.io.
publish = false
# `cargo run -p holon` runs holon itself, not the holon-server alias beside it.
default-run = "holon"
description = "Holon: build services by wiring small, pure parts together; deploy them with exactly the permissions they need, and see every run"
repository = "https://github.com/bekirmfr/holon"
homepage = "https://github.com/bekirmfr/holon"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
# `holon update` (selfmanage.rs): the newest release, and the installer that fetches it.
axoupdater = { version = "0.10", default-features = false, features = ["blocking", "github_releases"] }
blake3 = "1"
getrandom = "0.3"
# The transport's whole job is to move bytes to code that already exists and is already tested —
# no logic lives here that isn't already in holon-core/holon-host. See
# docs/L4s/P4.5-P4.6-transport-scoping-L4.md.
holon-core = { path = "../holon-core" }
# The flow commands (`holon new`, `check`, `show`, `fmt`), through the same code as the editor.
holon-author = { path = "../holon-author" }
holon-host = { path = "../holon-host" }
# The engine for module bodies: a run that places a module computes it here, under its budgets.
holon-module = { path = "../holon-module" }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
include_dir = { version = "0.7", optional = true }
jsonwebtoken = "9"
# The OS's change notices for the folders flows watch (`on file`, arrivals.rs): a dropped file
# starts its run without the folder being walked every second.
notify = "8"
rand = "0.10.2"
# The control plane's HTTP. (The data plane, public-facing, is hyper on tokio instead:
# src/dataplane.rs, docs/PLATFORM_LAYOUT.md §7b.)
# rouille (sync, thread-per-request, built on tiny_http) chosen deliberately over an async
# framework (axum/warp) — this server's whole workload is six low-volume request/response
# endpoints a person triggers by clicking a button in the editor, never a stream or a load
# nothing here needs an async runtime to serve. See the L4's framework-choice note.
rouille = "3.6"
# The SQLite databases an admin binds (databases.rs), built in: no library to install.
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
# The Postgres and MySQL databases an admin binds (engines.rs): pure Rust clients, TLS by rustls
# on ring (as ureq's), with the public CAs built in.
postgres = "0.19"
bytes = "1"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
# The MongoDB databases an admin binds (mongo.rs), Atlas's `mongodb+srv://` addresses included: the
# official driver, its blocking API, TLS by rustls on ring. On bson 3, not the default bson 2:
# bson 2 turns on serde_json's `preserve_order` for the whole build, and then a record literal
# lowered here would keep its keys as written, where the editor's wasm sorts them (two hashes for
# one flow; main.rs's test says so).
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "sync"] }
# `holon uninstall` removes its own executable, which Windows won't do directly.
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
toml = "0.8"
# `holon mcp setup` (mcphosts.rs) edits Codex's config.toml with its comments kept.
toml_edit = "0.22"
ureq = "2"
zeroize = "1"

# The secrets store's master key lives in the OS key store (secrets.rs): Credential Manager on
# Windows, the Keychain on macOS. Elsewhere it comes from a key file or an environment variable.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# The admin page's "browse…": the OS's own folder dialog, shown by `holon pick-folder` (pick.rs).
rfd = { version = "0.17", default-features = false }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }
rfd = { version = "0.17", default-features = false }
# What owns the folder dialog (pick.rs): the handle rfd takes.
raw-window-handle = "0.6"
# An owner-only ACL on the secrets file and its key file; a token typed without showing it.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
# The built editor (editor/dist, from `npm run build` in editor/) compiled into the binary and
# served at `/` (editor.rs): one file to install. Off by default, so a build needs no editor.
embed-editor = ["dep:include_dir"]

# Releases (cargo-dist, dist-workspace.toml) build the editor in: one file to install.
[package.metadata.dist]
# Released though never published to crates.io (publish = false hides it from dist otherwise).
dist = true
features = ["embed-editor"]
