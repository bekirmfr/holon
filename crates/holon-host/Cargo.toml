[package]
name = "holon-host"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false

[dependencies]
holon-core = { path = "../holon-core" }
# The store's long-lived values, packed and deflated (packs.rs).
flate2 = "1"

# Owner-only files on Windows: a protected DACL (restrict_to_owner).
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
blake3 = "1"