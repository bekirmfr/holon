[package]
name    = "holon-core"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false

[dependencies]
blake3   = "1"
hmac = "0.12"
sha2 = "0.10"
smallvec = "1"

[features]
# The eager evaluator, for differential tests in other crates.
eager-oracle = []

[dev-dependencies]
criterion = "0.5"
# Tests assemble tiny modules from text (docs/L4s/wasm-module-L4.md §7); never a dependency of
# core itself, whose purity-by-dependency argument keeps it to its four.
wat = "1"

[[bench]]
name = "native_vs_composite"
harness = false
