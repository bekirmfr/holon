[package]
name = "holon-author"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false

[dependencies]
# Pure, like core: no I/O, so the editor runs it in wasm (holon-wasm) and the command line and
# server natively, the same code.
holon-core = { path = "../holon-core" }
# The JavaScript engine module's bytes: the `js` statement places that unit (docs/L4s/js-node-L4.md
# §3), so lowering needs it wherever lowering runs. Pure like core: an engine, no I/O.
holon-module = { path = "../holon-module" }
serde = { version = "1", features = ["derive"] }
# The TypeScript parser a `.holon.ts` flow is read with (docs/L4s/typescript-syntax-L4.md §13):
# pure, and builds for wasm. Pinned together, and at 0.152 as later ones need a newer Rust than
# rust-toolchain.toml's. Regular expressions aren't parsed: Holon has no leaf for one.
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
# Walks a `js()` body for the types to blank before Boa runs it (§7).
oxc_ast_visit = "=0.152.0"
oxc_parser = { version = "=0.152.0", default-features = false }
oxc_span = "=0.152.0"
# A flow document's fields that only the editor reads pass through as JSON, and the text
# format quotes as JSON.
serde_json = "1"

[dev-dependencies]
# The eager evaluator, the oracle the samples are checked against.
holon-core = { path = "../holon-core", features = ["eager-oracle"] }
# A deployed flow's request run as the server runs it (benches/host_request.rs): its rounds.
holon-host = { path = "../holon-host" }

# The races (benches/race/mod.rs): each gap of JavaScript's library, a composite written in
# TypeScript against a native candidate, through the real eval
# (docs/engineering/themes/javascript-library.md §11). `cargo bench -p holon-author --bench NAME`.
[[bench]]
name = "races_numbers"
harness = false

[[bench]]
name = "races_texts"
harness = false

[[bench]]
name = "races_lists"
harness = false

[[bench]]
name = "races_records"
harness = false

[[bench]]
name = "races_evaluator"
harness = false

# What the races don't cover, for racing the evaluator before a change against after it: one call
# at the top level under the server's resolver and observer, and map and fold over numbers, texts
# and records (benches/perf_audit.rs); a sample flow's request through the host's rounds
# (benches/host_request.rs).
[[bench]]
name = "perf_audit"
harness = false

[[bench]]
name = "host_request"
harness = false
