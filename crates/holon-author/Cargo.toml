[package]
name = "holon-author"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false

[dependencies]
# Pure, like core: no I/O, so the editor runs it in wasm (holon-wasm) and the command line and
# server natively, the same code.
holon-core = { path = "../holon-core" }
serde = { version = "1", features = ["derive"] }
# A flow document's fields that only the editor reads pass through as JSON, and the text
# format quotes as JSON.
serde_json = "1"

[dev-dependencies]
# The eager evaluator, the oracle the samples are checked against.
holon-core = { path = "../holon-core", features = ["eager-oracle"] }
